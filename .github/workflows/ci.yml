name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm bot:types

            - name: Typecheck
              run: pnpm check

            - name: Lint
              run: pnpm lint

            - name: Format
              run: pnpm format:check

            - uses: twhlynch/lc3-test-suite@v3
              with:
                  assemble: '$GITHUB_WORKSPACE/cli/lc3 --assemble %s %o'
                  emulate: '$GITHUB_WORKSPACE/cli/lc3 --simulate %o'
                  timeout: '30'
                  extensions: 'false'
                  suppress: '0'
